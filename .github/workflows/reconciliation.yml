name: Reconciliation studio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Exercise the migration, sync and reconciliation cases
        run: npm test
      - name: Build the credential-free application route
        run: npm run build
      - name: Confirm the portable demo matches the source
        run: |
          npm run demo:export
          cmp dist/demo/index.html docs/demo/index.html
